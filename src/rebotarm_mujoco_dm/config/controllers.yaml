# Merged over the existing DM ros2_controllers.yaml by the launch file.
# Position gains remain in MJCF; these are trajectory acceptance tolerances.
rebotarm_controller:
  ros__parameters:
    allow_partial_joints_goal: true
    constraints:
      stopped_velocity_tolerance: 0.02
      goal_time: 2.0
      joint1: {trajectory: 0.15, goal: 0.02}
      joint2: {trajectory: 0.15, goal: 0.02}
      joint3: {trajectory: 0.15, goal: 0.02}
      joint4: {trajectory: 0.15, goal: 0.02}
      joint5: {trajectory: 0.15, goal: 0.02}
      joint6: {trajectory: 0.15, goal: 0.02}
gripper_controller:
  ros__parameters:
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 2.0
      finger_left: {trajectory: 0.01, goal: 0.002}
